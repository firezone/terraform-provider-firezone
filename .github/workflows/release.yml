---
name: Release
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags: ["v*"]

# No workflow_dispatch and no pull_request: the signing key is only
# reachable from a tag push, so a workflow change alone can't exfiltrate
# it without also cutting a release.
permissions:
  contents: read

jobs:
  goreleaser:
    name: Build, sign and publish release artifacts
    runs-on: ubuntu-latest
    # Scopes GPG_PRIVATE_KEY to a reviewed environment rather than the
    # repo secret store. Configure required reviewers on the "release"
    # environment so a run must be approved before the key is exposed.
    environment: release
    permissions:
      # GoReleaser creates the GitHub Release and uploads artifacts.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full history to resolve the previous tag.
          fetch-depth: 0

      # Same source of truth as CI: the Go version comes from
      # .tool-versions, so releases can't drift from what was tested.
      - name: Install pinned toolchain from .tool-versions
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.7.7"
          reshim: true
          cache_key_prefix: "mise-v1"

      - name: Import the release signing key
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Taken from the imported key rather than a separate secret, so
          # the two can't disagree.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
