---
name: Release
run-name: Release ${{ github.ref_name }}
on:
  push:
    tags: ["v*"]

# No workflow_dispatch and no pull_request: the signing key is only
# reachable from a tag push, so a workflow change alone can't exfiltrate
# it without also cutting a release.
permissions:
  contents: read

jobs:
  # Neither the tag ruleset nor the environment's deployment policy can
  # express "this tag must point at a commit on main" - a ruleset gates
  # who may create a tag, and the deployment policy only sees
  # refs/tags/vX.Y.Z, never the branch. So the check lives here.
  #
  # Kept as its own job, ahead of the one carrying `environment: release`,
  # so a tag cut from a side branch fails before a reviewer is asked to
  # approve exposing the signing key.
  verify-tag:
    name: Verify the tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-base needs both the tagged commit's history and main's.
          fetch-depth: 0

      - name: Refuse to release a commit that is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of main. Release tags must be cut from main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on main."

  goreleaser:
    name: Build, sign and publish release artifacts
    needs: verify-tag
    runs-on: ubuntu-latest
    # Scopes GPG_PRIVATE_KEY to a reviewed environment rather than the
    # repo secret store. Configure required reviewers on the "release"
    # environment so a run must be approved before the key is exposed.
    environment: release
    permissions:
      # GoReleaser creates the GitHub Release and uploads artifacts.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full history to resolve the previous tag.
          fetch-depth: 0

      # Same source of truth as CI: the Go version comes from
      # .tool-versions, so releases can't drift from what was tested.
      - name: Install pinned toolchain from .tool-versions
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: "2026.7.7"
          reshim: true
          cache_key_prefix: "mise-v1"

      - name: Import the release signing key
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Taken from the imported key rather than a separate secret, so
          # the two can't disagree.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
